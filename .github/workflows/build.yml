name: CI — Build & Static Analysis

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  compile-check:
    name: Compile Check (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Verify all C sources compile
        run: |
          set -e
          INCS="-I test/stubs -I Core/Inc -I config -I Drivers/BSP/knx_tpuart -I Drivers/BSP/modbus_rs485 -I Drivers/BSP/eeprom -I App/DataBroker -I App/LogicEngine -I App/VirtualHolder -I Middlewares/KNX/Stack -I Middlewares/KNX/ETS -I Middlewares/Modbus/Stack -I Middlewares/Modbus/ClientServer"
          FLAGS="-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -DSTM32F407xx -O2 -Wall -Wextra -Werror -fsyntax-only"
          SOURCES="Core/Src/main.c Core/Src/diag_task.c Drivers/BSP/knx_tpuart/knx_tpuart.c Drivers/BSP/modbus_rs485/modbus_rs485.c Drivers/BSP/eeprom/nvram.c App/DataBroker/data_broker.c App/DataBroker/mapping_table.c App/LogicEngine/logic_blocks.c App/LogicEngine/pi_controller.c App/LogicEngine/dew_point.c App/VirtualHolder/virtual_holder.c"
          arm-none-eabi-gcc $INCS $FLAGS $SOURCES 2>&1
          echo "All sources compile OK."

  static-analysis:
    name: MISRA C 2012 (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck (MISRA addon)
        run: |
          cppcheck \
            --enable=all \
            --addon=misra \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=0 \
            -I test/stubs \
            -I Core/Inc \
            -I config \
            -I Drivers/BSP/knx_tpuart \
            -I Drivers/BSP/modbus_rs485 \
            -I Drivers/BSP/eeprom \
            -I App/DataBroker \
            -I App/LogicEngine \
            -I App/VirtualHolder \
            -I Middlewares/KNX/Stack \
            -I Middlewares/KNX/ETS \
            -I Middlewares/Modbus/Stack \
            -I Middlewares/Modbus/ClientServer \
            Core/Src/ App/ Drivers/ Middlewares/ config/

  format-check:
    name: Code Formatting (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format

      - name: Check formatting
        run: |
          find . -name '*.c' -o -name '*.h' \
            | xargs clang-format --dry-run --style=file 2>&1 | head -50 || true
        continue-on-error: true

  struct-size-check:
    name: Struct Size Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Verify static asserts compile
        run: |
          cat > /tmp/check.c << 'EOF'
          #include "shared_types.h"
          #include "eeprom_layout.h"
          int main(void) { return 0; }
          EOF
          arm-none-eabi-gcc -fsyntax-only \
            -mcpu=cortex-m4 -mthumb \
            -I test/stubs -I Core/Inc -I config \
            -DSTM32F407xx \
            /tmp/check.c
          echo "Static asserts OK."
